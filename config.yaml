# Cấu hình mẫu của Hệ thống giám sát tư thế học tập.
# Mọi ngưỡng đặt ở đây, không sửa trong code (docs/SPEC_V2.md §1, §6).
# Bỏ một khóa thì chương trình dùng giá trị mặc định trong src/posture_monitor/config.py.

camera:
  source: usb:0          # usb:N | picamera | file:duong_dan.mp4 | rtsp:rtsp://...
  # Camera IP (RTSP): dùng luồng PHỤ (sub-stream), đừng dùng luồng chính 1080p —
  # dự án thu 640x480 rồi YOLO resize về imgsz 320, nên 1080p chỉ tốn CPU giải mã.
  #   ví dụ luồng phụ 704x576:  # rtsp:rtsp://user:matkhau@192.168.1.50:554/1/2
  # KHÔNG dán URL thật (có mật khẩu) vào file này: nó được commit. Chọn một trong hai:
  #   1) copy sang config.local.yaml (đã bị .gitignore chặn) rồi chạy
  #      python -m posture_monitor run --config config.local.yaml
  #   2) đặt biến môi trường POSTURE_CAMERA_SOURCE="rtsp://user:matkhau@host:554/1/2"
  #      (biến môi trường thắng khóa camera.source ở trên, mật khẩu không nằm trong file nào)
  #      Ở biến môi trường, URL trần như trên chạy được luôn (tự hiểu là rtsp:);
  #      dạng tường minh "rtsp:rtsp://user:matkhau@host:554/1/2" cũng chạy.
  width: 640
  height: 480
  view: front            # front | side
  # Điều khiển PTZ qua ONVIF (tuỳ chọn). Dashboard có bốn nút xoay; route
  # POST /api/ptz gọi xuống đây.
  # QUY ƯỚC MỘT ĐỊA CHỈ CAMERA, MỘT NƠI KHAI:
  #   - 'host' để trống thì suy ra từ 'camera.source' khi đó là URL rtsp://
  #     (đặt qua POSTURE_CAMERA_SOURCE). Đó là đường khuyến nghị: chỉ một chỗ
  #     chứa IP camera, không lặp lại ở đây.
  #   - Điền 'host' chỉ khi camera PTZ khác host của luồng ảnh.
  #   - 'enabled' để trống là TỰ ĐỘNG: bật khi xác định được host, tắt khi
  #     không. Ghi false để chủ động tắt dù có host.
  # LƯU Ý: 'port' ở mục này là cổng HTTP ONVIF (mặc định 80), KHÔNG phải cổng
  # RTSP. Loa của camera nằm ở mục 'speaker' bên dưới, dùng cổng 554.
  onvif:
    enabled: auto        # auto | true | false
    host: ""             # trống = suy ra từ camera.source
    port: 80             # cổng HTTP ONVIF (không phải RTSP)
    user: "admin"        # bị tài khoản trong camera.source thay khi dùng nó
    # Mật khẩu KHÔNG nằm trong file này (file được commit). Thứ tự ưu tiên:
    #   1) POSTURE_ONVIF_PASSWORD
    #   2) tài khoản nhúng trong URL của POSTURE_CAMERA_SOURCE
    # 'enabled: true' mà cả hai đều không có thì báo lỗi cấu hình ngay lúc nạp.
    # Nếu không có mật khẩu, PTZ tự coi như tắt và /api/ptz báo lỗi tiếng Việt
    # chỉ rõ cách sửa.
  # Loa của camera IP, phát qua RTSP backchannel (route POST /api/speak).
  # Đây là một TÀI NGUYÊN KHÁC với mục 'onvif' ở trên và dùng cổng khác:
  #   - onvif.port   = cổng HTTP ONVIF (80) để điều khiển PTZ
  #   - speaker.port = cổng RTSP (554) để mở backchannel phát tiếng
  # Gộp hai mục làm một sẽ khiến cấu hình bên này ghi đè bên kia.
  speaker:
    # Bật sẵn: tính năng loa là hành vi đã kiểm chứng (PCMA 8 kHz, SPEAK_OK
    # trên Pi). Host KHÔNG ghi ở đây mà suy từ 'camera.source' khi đó là URL
    # rtsp:// (đặt qua POSTURE_CAMERA_SOURCE) — cùng quy ước với camera.onvif.
    # Nếu không suy được host (ví dụ 'camera.source: usb:0' như file mẫu này),
    # cấu hình VẪN nạp được và loa chỉ ghi sự kiện, không phát tiếng; /api/speak
    # báo lỗi tiếng Việt chỉ rõ cách sửa. Muốn có tiếng thì đặt
    # POSTURE_CAMERA_SOURCE='rtsp:rtsp://...' hoặc điền 'host' bên dưới.
    enabled: true        # true thì /api/speak mới phát được
    host: ""             # trống = suy ra từ camera.source (giống camera.onvif)
    port: 554            # cổng RTSP (không phải cổng HTTP ONVIF)
    user: ""             # trống = tài khoản trong camera.source, không có thì "admin"
    stream_path: "/1/2"  # luồng phụ đã kiểm chứng cho backchannel
    # Mật khẩu cũng KHÔNG nằm ở đây. Thứ tự ưu tiên giống camera.onvif:
    #   1) POSTURE_ONVIF_PASSWORD
    #   2) tài khoản nhúng trong URL của POSTURE_CAMERA_SOURCE
    # Nhờ vậy chỉ cần đặt POSTURE_CAMERA_SOURCE là cả PTZ lẫn loa chạy.

model:
  name: yolo11n-pose     # dự phòng: yolov8n-pose
  format: ncnn           # ncnn | onnx | pt
  imgsz: 320
  # 5 FPS là mục tiêu trên Pi 4 (số đo Pi trong docs/SPEC_V3.md: 199,25
  # ms/khung ≈ 5,02 FPS pose-only). Trên laptop thì pipeline chịu được ~14 FPS
  # (đo với camera Tiandy 704x576, ncnn, RTSP đọc nền), nên khi test trên
  # laptop hãy chạy: python -m posture_monitor run --fps 15
  target_fps: 5
  kp_conf_min: 0.5
  # false = export NCNN ngay trên Pi (mặc định, đo thật 42,8 giây, spec §5.2).
  # true  = copy thư mục *_ncnn_model từ PC sang; chỉ dùng khi không muốn cài pnnx.
  # Lưu ý: dù export trên PC, torch vẫn là phụ thuộc bắt buộc lúc chạy trên Pi.
  export_on_pc: false

tracking:
  enabled: true          # chọn người theo track id (spec §5.6)
  tracker: botsort.yaml

# Phát hiện "đang dùng điện thoại" (spec §5).
# Model pose yolo11n-pose CHỈ có lớp 'person' nên không bao giờ trả hộp điện
# thoại; mục này nạp thêm một model detect COCO 80 lớp và lấy lớp 'cell phone'.
# Số duy nhất đã đo cho model detect: yolo11n ncnn @320 = 98,6 ms cho một lần
# suy luận trên khung TỔNG HỢP 640x480 (chỉ inference, KHÔNG gồm capture,
# không phải khung camera thật). Cùng lần chạy đó, pose + detect ở MỌI khung
# đo được 4,90 FPS.
# Chi phí detect trong pipeline thật CHƯA ĐO. Phép đo pipeline thật duy nhất
# là pose-only 199,25 ms -> 5,02 FPS; ghép detect cách khung theo số đo đó ra
# ~4,02 FPS, KHÔNG đạt >= 5 FPS. Vì vậy detect_every_n_frames = 2 chỉ là
# mặc định CHƯA CÓ NGÂN SÁCH ĐO - cần đo lại bằng benchmark --profile pose_phone.
phone:
  enabled: true
  detect_model: yolo11n        # model COCO 80 lớp (có 'cell phone' = lớp 67)
  detect_weights: ""           # trống = "<detect_model>.pt"
  detect_every_n_frames: 2     # mặc định chưa có ngân sách đo, xem chú thích trên
  imgsz: 320
  # Đo trên camera Tiandy thật (704x576, RTSP): bản NCNN chỉ tới 0,236 cho
  # điện thoại thật, nên 0,25 cho 0/30 khung có hộp. Dải dùng được 0,05-0,08.
  conf_threshold: 0.06
  # KHÔNG dùng model.kp_conf_min (0,5): cổ tay đang cầm điện thoại chỉ đạt
  # 0,35-0,43, nên ngưỡng 0,5 loại luôn cổ tay duy nhất và không chạy detect.
  wrist_conf_min: 0.25
  # Cổ tay cách hộp thật 112-138 px = 0,70-0,86 lần bề rộng vai. Ngưỡng chạm
  # = touching_slack_px + shoulder_ratio * bề_rộng_vai; 1,0 phủ hết dải đo.
  # Ngưỡng pixel cố định 0 (cấu hình cũ) cho 0/40 khung chạm.
  shoulder_ratio: 1.0
  touching_slack_px: 0         # cộng thêm cố định vào ngưỡng trên (px)
  # Bỏ hộp lớp 67 phủ vùng đầu: gọng kính bị dò nhầm với conf 0,023-0,068,
  # chồng dải với điện thoại thật nên không lọc được bằng ngưỡng conf.
  # CẢNH BÁO: đo trên dữ liệu thật, phép thử này không bắt được hộp nào
  # (0/32) - hộp gọng kính hẹp và lệch x nên không phủ điểm mũi. Nó KHÔNG
  # phải thứ sửa lỗi báo nhầm; phone_like_filter bên dưới mới là.
  head_filter: true
  # Bỏ hộp lớp 67 không nằm đúng chỗ điện thoại đang cầm. Đây là thứ sửa lỗi
  # báo nhầm: khi đưa tay lên cằm, gọng kính được dò với conf tới 0,699 còn
  # điện thoại thật chỉ 0,347, nên KHÔNG ngưỡng conf nào tách được.
  # Đo trên 3 ảnh có điện thoại thật + 20 ảnh không có:
  #   - tâm hộp so với đường vai: hộp thật -2..+13 px, hộp giả -68..-293 px
  #     (vế này một mình loại 22/24 hộp giả)
  #   - cạnh dài hộp / bề rộng vai: hộp thật 0,515-1,061; hai hộp giả còn lại
  #     0,310 và 0,382 (vế này quyết định đúng hai hộp đó)
  # Kết quả: giữ 8/8 hộp thật, loại 0/24 hộp giả. Hai ngưỡng dưới đo trên
  # MỘT người, MỘT phiên, MỘT khoảng cách camera - chỉnh nếu khác điều kiện.
  phone_like_filter: true
  # Cạnh DÀI của hộp / bề rộng vai (không phải bề rộng: điện thoại cầm dọc
  # có bề rộng nhỏ sẽ bị loại oan). 0,45 nằm giữa 0,382 và 0,515.
  min_size_ratio: 0.45
  max_above_shoulder_px: 10    # hộp được cao hơn đường vai tối đa (px)
  # Van an toàn cho điện thoại GIƠ LÊN CHE MẶT. Hai ngưỡng trên đo trên điện
  # thoại cầm trước ngực; giơ lên che mặt thì hộp phủ mũi, tâm cao hơn vai
  # hơn 200 px, cạnh dài 2,83 lần bề rộng vai -> cả head_filter lẫn
  # phone_like_filter đều bỏ đúng trường hợp thật (đo trên frame.jpg).
  # KHÔNG chọn mốc thấp: bề rộng vai co lại khi người quay chéo (112 px trên
  # frame.jpg), lúc đó hộp gọng kính thật đạt 1,35 và hộp giả rộng đạt 1,67.
  # Quét 8 ca (3 thật, 5 giả, gồm 2 ca vai hẹp): dải an toàn 1,8-2,8, chọn giữa.
  # 0 = tắt van.
  oversize_ratio: 2.25
  box_ttl_s: 0.5               # hộp detect còn dùng được bao lâu (giây)
  # Chạm liên tục 1 s là tính "đang dùng điện thoại". Đây là ngưỡng cho
  # DASHBOARD; cảnh báo loa dùng 'schedule.kinds.phone.hold_s' bên dưới và
  # phải bằng hoặc gần bằng giá trị này, nếu không web báo mà loa im.
  hold_s: 1.0
  # Ở 5,2 FPS, hộp detect chỉ sống ~1/3 số khung; đứt ngay thì hold_s vô nghĩa.
  miss_tolerance_frames: 4

thresholds:
  head_down_ratio: 0.70
  too_close_ratio: 1.25
  shoulder_tilt_deg: 8
  head_tilt_deg: 12
  lean_x: 0.35
  look_away_yaw: 0.5
  neck_angle_drop_deg: 15   # chỉ dùng cho view side

timing:
  smooth_window_s: 1.0
  bad_hold_s: 5
  good_hold_s: 2
  alert_cooldown_s: 30
  escalate_after_s: 60
  break_after_min: 45
  absent_reset_s: 120
  drowsy_hold_s: 10

alerts:
  buzzer_enabled: true
  vibration_enabled: true
  # Tắt theo mặc định vì chủ đề này không chấm điểm tư thế. Bật lên ('true')
  # chỉ khi thực sự muốn cảnh báo bằng GPIO (kêu/rung); LED vẫn cập nhật
  # trạng thái khi tắt.
  gpio_alert_enabled: false

# Nhãn tư thế vẫn được tính (để hiển thị/debug) nhưng không sinh cảnh báo;
# ABSENT không bị ảnh hưởng — cảnh báo "đi ra khỏi khung hình" vẫn cần nó.
posture_labels_enabled: false

hardware:
  mock: auto             # auto | true | false
  pins:
    led_green: 17
    led_yellow: 27
    led_red: 22
    buzzer: 18
    vibration: 23
    trig: 5
    echo: 6              # BẮT BUỘC chia áp 5V -> 3.3V trước khi nối vào GPIO

sensors:
  ultrasonic_enabled: true
  min_distance_cm: 35

# Ngưỡng trạng thái hiện diện ("người còn ngồi trước bàn không").
# Module: src/posture_monitor/presence.py.
# CHỈ có tác dụng khi 'schedule.enabled: true': vòng lặp chỉ dùng giá trị này
# để điền 'held' cho cảnh báo "rời khung hình" trong giờ học. Khi giờ học
# đang tắt (mặc định) nó không đổi hành vi gì.
presence:
  absent_grace_s: 3.0    # số giây vắng LIÊN TỤC trước khi coi là đã rời khung
                         # (khớp presence.DEFAULT_ABSENT_HOLD_S). Đây là bộ
                         # lọc nhiễu, khác 'schedule.kinds.leave_frame.hold_s'
                         # (5 s) — điều kiện phải giữ đủ lâu mới thành cảnh báo.

# Nhận diện khuôn mặt (YuNet phát hiện + SFace đặc trưng — spec V3 §5.13, §6).
# 'match_threshold' để null nghĩa là CHƯA có số đo tay. Khi đó ngưỡng được
# TỰ SUY RA từ chính các mẫu đăng ký của bạn (độ giống nhau thấp nhất giữa
# hai mẫu cùng người, trừ một khoảng an toàn) ngay khi đăng ký đủ
# 'enroll_min_samples' mẫu; trước đó mọi quan sát là UNKNOWN.
# Không có ngưỡng bịa nào ở đây — spec §5.13 cấm chép ngưỡng từ tài liệu/repo
# khác vào làm mặc định. Muốn đặt tay: chạy 'python scripts/face_threshold_probe.py'
# rồi dán số đo vào 'match_threshold' (số trong config LUÔN thắng số tự suy).
# 'enabled' để trống = tự động: bật khi đã có match_threshold, tắt khi chưa.
face:
  enabled: true                # bật; ngưỡng tự suy ra khi đăng ký đủ mẫu
  detector: yunet.onnx         # 228 KB — đường dẫn tới tệp mô hình phát hiện
  recognizer: sface.onnx       # 37 MB — tệp mô hình đặc trưng
  interval_s: 2.0              # KHÔNG chạy mỗi khung (86,1 ms/lượt, spec §4.2)
  # Ngưỡng điểm của YuNet. Lý do hạ xuống: ở 0,9 bộ phát hiện BỎ MẤT mặt thật
  # trên một phần khung, nên mỗi bước đăng ký 1,5 s (~7 khung @5 FPS) không
  # chắc có mẫu và "Thêm người mới" hỏng ngẫu nhiên.
  # Đo trên 10 ảnh TĨNH sạch (640x480, 704x576, 1280x720; cùng một người), quét
  # ở ngưỡng 0,01 để thấy mọi hộp ứng viên:
  #   - 0,9 giữ được mặt ở 7/10 ảnh; 0,7 giữ được 10/10.
  #   - Mặt THẬT điểm 0,862-0,928; hộp ứng viên kế tiếp chỉ 0,451.
  #     Như vậy dải trống giữa mặt thật và rác là 0,451 .. 0,862, và 0,7 nằm
  #     giữa dải đó (cách rác 0,25, cách mặt thật 0,16).
  # Chuỗi 14 khung liên tiếp của MỘT phiên bị tay che mặt (không phải phiên
  # ngồi học bình thường - đã xem lại từng ảnh) cũng cùng chiều: 0,9 -> 2/14,
  # 0,8 -> 6/14, 0,7 -> 8/14, 0,6 -> 9/14, 0,5 -> 10/14.
  # Đánh đổi: hạ ngưỡng làm tăng khả năng nhận hộp giả khi mặt bị che; hộp nhỏ
  # <40 px vẫn bị min_face_px loại. Chỉnh lên nếu thấy nhận nhầm người trong log.
  score_threshold: 0.7
  match_threshold: null        # null = chưa có số đo → tự suy từ mẫu đăng ký
  impostor_hold_s: 5.0
  enroll_step_s: 1.5
  enroll_min_samples: 3
  # CHƯA có người đọc: đường chạy thật (_build_face_processor trong
  # __main__.py) cố ý detect trên khung gốc, không thu nhỏ. Đừng bật rồi
  # tưởng là đã tối ưu — đo trên Pi (cv2 5.0.0, 20 khung thật): khung gốc
  # 704x576 thấy mặt 20/20, còn 320x320 chỉ 0–3/20 vì score sát ngưỡng của
  # YuNet lúc đó (0,9). Ngưỡng nay đã có khoá là 'score_threshold' ở trên,
  # nhưng các số 320x320 đó CHƯA đo lại ở 0,7, nên chưa đủ căn cứ bật thu nhỏ.
  detect_width: 320
  # CHƯA có người đọc: face_worker.py (nơi duy nhất gọi CLAHE) không được
  # khởi tạo ở đâu trong src/, nên chống ngược sáng hiện không chạy.
  clahe_enabled: true
  store_path: "data/faces.json"  # chỉ chứa vector + tên, KHÔNG có ảnh

storage:
  db_path: data/posture.db
  retention_days: 30

# Giọng đọc cảnh báo. Ba câu được đọc ra loa camera khi vi phạm.
#
# Nguồn của tiếng, theo thứ tự ưu tiên (tự rơi xuống khi thiếu):
#   1. Bản thu giọng người trong 'audio_dir/giongnam' hoặc 'audio_dir/giongnu'.
#      Đo bằng STOI qua đúng chuỗi của camera (8 kHz -> A-law 8 bit -> loa nhỏ
#      của camera): 0,958-0,972, so với 0,929-0,945 của espeak-ng. Giọng người
#      thật dễ nghe hơn hẳn giọng tổng hợp trên loa nhỏ.
#   2. Giọng máy espeak-ng (cần cài espeak-ng) cho câu chưa có bản thu.
#   3. Tiếng bíp nếu cả hai đường trên đều không dùng được.
#
# Đặt tên file bản thu: TRÙNG MÃ LOẠI CẢNH BÁO là chắc chắn nhất
# ('leave_frame.mp3', 'phone.wav', 'stranger.m4a'). Nếu tên theo câu đọc thì
# app vẫn nhận ra qua từ khoá ('catdienthoaigongnam.mp3',
# 'Banoiquaylaibanhocnhegiongnu.mp3'); xem CLIP_KEYWORDS trong
# voice_library.py để biết danh sách từ khoá.
#
# Chọn giọng trên dashboard: thẻ "Giọng đọc" -> bấm "Giọng nam"/"Giọng nữ".
# Lựa chọn được ghi vào 'audio_dir/voice.json' nên lần chạy sau vẫn nhớ; giá
# trị 'voice' dưới đây chỉ là mặc định khi chưa có lựa chọn nào được lưu.
speaker_alert:
  say: true              # false = chỉ phát tiếng bíp, không đọc câu
  tone_fallback: true    # thiếu bản thu + thiếu espeak-ng thì bíp thay vì im
  audio_dir: data/audio  # chứa WAV máy sinh + 'giongnam' + 'giongnu'
  language: vi           # ngôn ngữ cho espeak-ng (đường dự phòng)
  voice: nam             # nam | nu | espeak  (mặc định khi chưa lưu lựa chọn)
  # Âm lượng gửi ra loa (0.05..1.0). KHÔNG phải núm vặn của camera: hạ xuống
  # thì loa nhận tín hiệu nhỏ hơn nên ít bị rè. Loa 2 cm của camera thường dễ
  # nghe hơn ở 0.6-0.7; 1.0 là mức nguyên bản và dễ bị méo nhất.
  volume: 0.7
  # Tốc độ đọc (0.5..1.0). 0.9 = chậm lại 10 %. Chậm hơn giúp nghe rõ phụ âm
  # trên loa hẹp của camera, và dùng 'atempo' nên KHÔNG làm giọng trầm xuống.
  # Thử bằng tai: python -m posture_monitor speak-test --speed 0.85
  speed: 0.9

web:
  host: 0.0.0.0
  port: 8000
  # Bật sẵn: web server phải hiển thị được luồng camera (chức năng chính).
  # Khung hình chỉ đi qua bộ nhớ (DashboardState) rồi tới trình duyệt trong
  # LAN — KHÔNG ghi xuống đĩa, KHÔNG lưu lịch sử ảnh. Spec v2 §11.5 cấm
  # lưu/truyền ảnh; hiển thị trực tiếp, không lưu, là việc khác.
  stream_enabled: true

# Giờ học quy định: chỉ phát cảnh báo trong các khung giờ dưới đây.
# Module quyết định: src/posture_monitor/schedule.py. Mặc định TẮT (enabled:
# false = cảnh báo bất cứ lúc nào, không giới hạn giờ).
# Giờ PHẢI đặt trong ngoặc kép: YAML đọc 19:00 không ngoặc kép thành số 1140.
schedule:
  enabled: false
  windows:
    # Thứ trong tuần dùng tên: mon tue wed thu fri sat sun.
    - days: [mon, tue, wed, thu, fri]
      start: "19:00"
      end: "21:30"
    - days: [sat, sun]
      start: "08:00"
      end: "11:00"
    # Khung qua đêm thuộc về ngày BẮT ĐẦU: khung thứ Sáu này bao cả
    # thứ Bảy 00:30, nhưng thứ Bảy 23:30 thì không.
    # - days: [fri]
    #   start: "22:00"
    #   end: "01:00"
  # Tắt riêng từng loại cảnh báo và đặt nhịp nhắc lại/thời gian giữ riêng.
  # Bỏ một loại thì loại đó dùng mặc định trong src/posture_monitor/schedule.py.
  #
  # 'cooldown_s' ở đây là NHỊP NHẮC LẠI khi lỗi còn tiếp diễn, không phải
  # "báo một lần rồi im". Điều kiện còn đúng thì held_s còn tăng, nên cứ mỗi
  # 'cooldown_s' giây là loa nhắc lại một lần; điều kiện hết thì held_s về 0
  # và chuỗi nhắc tự dừng. Giá trị 2 = đúng yêu cầu vận hành "2 giây nhắc một
  # lần cho tới khi hết lỗi".
  kinds:
    leave_frame:           # rời khung hình
      enabled: true
      cooldown_s: 2
      hold_s: 5
    phone:                 # dùng điện thoại
      enabled: true
      # Phải bằng 'phone.hold_s' ở trên (1.0). Lệch ngưỡng là nguyên nhân
      # "web hiện đang dùng điện thoại mà loa không báo": web đọc
      # 'phone.hold_s' để hiện, loa đọc giá trị này để quyết định phát.
      hold_s: 1.0
      # Nhắc lại mỗi 2 giây trong khi vẫn còn cầm điện thoại.
      cooldown_s: 2
    stranger:              # có người lạ
      enabled: true
      cooldown_s: 2
      hold_s: 5

# Phiên học bật/tắt bằng tay (nút "Bắt đầu học" trên dashboard).
# Khác 'schedule' ở trên: 'schedule' là lịch theo tuần (tự động), còn mục này
# là việc người dùng ngồi xuống bấm nút. Cả hai phải cùng cho phép thì mới
# cảnh báo — xem src/posture_monitor/study_session.py.
session:
  # Thời lượng gợi ý khi mở dashboard (phút). Đếm NGƯỢC: hết số này thì hệ
  # thống tự dừng model và báo một câu.
  default_minutes: 60
  # false = phải bấm "Bắt đầu học" thì model AI (pose + dò điện thoại) mới
  # chạy. Nhận diện khuôn mặt vẫn chạy để dashboard biết ai đang ngồi.
  # true = tự vào phiên ngay khi khởi động (tiện khi demo, không nên dùng
  # hằng ngày vì model chạy suốt cả ngày).
  auto_start: false

