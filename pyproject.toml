[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posture-monitor"
version = "0.1.0"
description = "Hệ thống giám sát học tập trên Raspberry Pi 4 (Camera RTSP/USB, AI Vision, Web Dashboard, Loa cảnh báo)"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
posture-monitor = "posture_monitor.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
